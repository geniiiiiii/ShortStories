<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short Stories Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: Lernapp shell (Globalisierung / Français L7): sidebar + sticky topbar + 820px page column, Dub-style cards */
:root{
  --bg:#fafafa; --surface:#ffffff; --surface-2:#f5f5f5; --surface-3:#ebebeb;
  --border:#e5e5e5; --border-strong:#d4d4d4; --text:#0a0a0a; --text-2:#3f3f46; --text-3:#6b6b74;
  --primary:#0a0a0a; --primary-hover:#2a2a2e; --on-primary:#ffffff;
  --grid:rgba(0,0,0,.055); --hover:rgba(0,0,0,.045);
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px -8px rgba(0,0,0,.10); --shadow-lg:0 2px 4px rgba(0,0,0,.04),0 24px 48px -16px rgba(0,0,0,.18);
  --green:#15803d; --green-bg:#f0fdf4; --green-bd:#bbf7d0; --green-solid:#22c55e;
  --red:#b91c1c; --red-bg:#fef2f2; --red-bd:#fecaca;
  --blue:#1d4ed8; --blue-bg:#eff6ff; --blue-bd:#bfdbfe; --blue-solid:#3b82f6;
  --amber:#a16207; --amber-bg:#fefce8; --amber-bd:#fde68a;
  --purple:#6d28d9; --purple-bg:#f5f3ff; --purple-bd:#ddd6fe; --purple-solid:#8b5cf6;
  --r-sm:8px; --r:12px; --r-lg:16px; --sb-w:288px; --top-h:64px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0b; --surface:#141416; --surface-2:#1b1b1e; --surface-3:#26262a; --border:#27272a; --border-strong:#3f3f46;
  --text:#fafafa; --text-2:#d4d4d8; --text-3:#a1a1aa; --primary:#fafafa; --primary-hover:#e4e4e7; --on-primary:#0a0a0a;
  --grid:rgba(255,255,255,.06); --hover:rgba(255,255,255,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px -8px rgba(0,0,0,.6); --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 48px -16px rgba(0,0,0,.8);
  --green:#4ade80; --green-bg:rgba(34,197,94,.12); --green-bd:rgba(34,197,94,.35);
  --red:#f87171; --red-bg:rgba(239,68,68,.12); --red-bd:rgba(239,68,68,.35);
  --blue:#60a5fa; --blue-bg:rgba(59,130,246,.12); --blue-bd:rgba(59,130,246,.35);
  --amber:#facc15; --amber-bg:rgba(234,179,8,.12); --amber-bd:rgba(234,179,8,.35);
  --purple:#c4b5fd; --purple-bg:rgba(139,92,246,.14); --purple-bd:rgba(139,92,246,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0b; --surface:#141416; --surface-2:#1b1b1e; --surface-3:#26262a; --border:#27272a; --border-strong:#3f3f46;
  --text:#fafafa; --text-2:#d4d4d8; --text-3:#a1a1aa; --primary:#fafafa; --primary-hover:#e4e4e7; --on-primary:#0a0a0a;
  --grid:rgba(255,255,255,.06); --hover:rgba(255,255,255,.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px -8px rgba(0,0,0,.6); --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 48px -16px rgba(0,0,0,.8);
  --green:#4ade80; --green-bg:rgba(34,197,94,.12); --green-bd:rgba(34,197,94,.35);
  --red:#f87171; --red-bg:rgba(239,68,68,.12); --red-bd:rgba(239,68,68,.35);
  --blue:#60a5fa; --blue-bg:rgba(59,130,246,.12); --blue-bd:rgba(59,130,246,.35);
  --amber:#facc15; --amber-bg:rgba(234,179,8,.12); --amber-bd:rgba(234,179,8,.35);
  --purple:#c4b5fd; --purple-bg:rgba(139,92,246,.14); --purple-bd:rgba(139,92,246,.4); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{font-size:17px}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-wrap:break-word;overflow-x:clip}
a{color:inherit} button{font:inherit;color:inherit}
h1,h2,h3{letter-spacing:-.02em;text-wrap:balance}
.ic{width:20px;height:20px;flex:none;display:block}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* Shell */
.app{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--surface-2);border-right:1px solid var(--border)}
.sb-inner{height:100%;overflow-y:auto;padding:20px 16px 28px;display:grid;align-content:start;gap:16px;scrollbar-width:thin}
.logo{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:4px 8px;text-decoration:none}
.logo-mark{width:42px;height:42px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:-.04em}
.logo-txt{display:grid;line-height:1.25}.logo-t{font-weight:700;font-size:17px}.logo-s{font-size:14px;color:var(--text-3)}
.nav{display:grid;gap:2px}
.nav-h{font-size:13px;font-weight:600;color:var(--text-3);padding:12px 12px 6px}
.nav a{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:center;padding:8px 12px;border-radius:var(--r-sm);color:var(--text-2);text-decoration:none;font-size:15.5px;font-weight:500;border:1px solid transparent}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.on{background:var(--surface);color:var(--text);border-color:var(--border);box-shadow:var(--shadow-sm)}
.nav .ic{width:19px;height:19px}
.main-col{min-width:0;display:grid;grid-template-rows:auto 1fr}
.topbar{position:sticky;top:0;z-index:30;height:var(--top-h);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:0 28px 0 32px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--text-3);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--text)}
.crumbs b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumbs .ic{width:14px;height:14px}
.icon-btn{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;color:var(--text-2);cursor:pointer;box-shadow:var(--shadow-sm)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.menu-btn{display:none!important}
.backdrop{display:none}
main{min-width:0}
.page{max-width:860px;margin:0 auto;padding:40px 40px 100px}
@media (prefers-reduced-motion:no-preference){main{animation:pageIn .3s ease both}@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
.ph{display:grid;gap:8px;margin-bottom:24px}
.ph h1{font-size:34px;line-height:1.15;letter-spacing:-.03em;font-weight:700;margin:0}
.ph p{margin:0;color:var(--text-2);font-size:17.5px}
.sec-h{display:grid;gap:4px;margin:44px 0 16px}
.sec-h h2{font-size:24px;margin:0;font-weight:700}
.sec-h p{margin:0;color:var(--text-3)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--text-3)}
p{margin:0 0 10px}p:last-child{margin-bottom:0}
ul{margin:0;padding-left:20px}li{margin:3px 0}

/* Buttons */
.btn{display:inline-grid;grid-auto-flow:column;gap:8px;align-items:center;justify-content:center;height:46px;padding:0 20px;border-radius:var(--r-sm);font-size:16px;font-weight:500;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn .ic{width:18px;height:18px}
.btn-p{background:var(--primary);color:var(--on-primary)}.btn-p:hover{background:var(--primary-hover)}
.btn-s{background:var(--surface);color:var(--text);border-color:var(--border-strong);box-shadow:var(--shadow-sm)}.btn-s:hover{background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 15px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-size:15px;font-weight:500;cursor:pointer}
.chip:hover{color:var(--text);background:var(--surface-2)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* Cards and boxes */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-b{padding:24px}
.grid-top{position:relative;border-bottom:1px solid var(--border);background:var(--surface-2);overflow:hidden;display:grid;place-items:center}
.grid-top::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-position:center;-webkit-mask-image:radial-gradient(ellipse 80% 90% at 50% 50%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 80% 90% at 50% 50%,#000 40%,transparent 100%)}
.badge-ic{position:relative;width:60px;height:60px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.45)}
.badge-ic .ic{width:26px;height:26px}
.tile{position:absolute;width:34px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-3);box-shadow:var(--shadow-sm)}
.tile .ic{width:16px;height:16px}
.box{position:relative;border:1px solid var(--blue-bd);background:var(--blue-bg);border-radius:10px;padding:14px 18px 14px 50px;margin:16px 0;font-size:16.5px}
.box>.ic.bx{position:absolute;left:17px;top:16px;width:20px;height:20px;color:var(--blue)}
.box.green{border-color:var(--green-bd);background:var(--green-bg)}.box.green>.ic.bx{color:var(--green)}
.box.amber{border-color:var(--amber-bd);background:var(--amber-bg)}.box.amber>.ic.bx{color:var(--amber)}
.box.purple{border-color:var(--purple-bd);background:var(--purple-bg)}.box.purple>.ic.bx{color:var(--purple)}
.box-t{display:block;font-weight:600;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{background:var(--surface-2);text-align:left;font-weight:600;font-size:14px;color:var(--text-2);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:16px 0}
.field{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--surface)}
.field b{display:block;margin-bottom:4px}
.field div{font-size:15.5px;color:var(--text-2);line-height:1.65}
.field .ex{margin-top:6px;font-size:14.5px;color:var(--text-3)}
details.try{border:1px dashed var(--border-strong);border-radius:10px;padding:0 16px;margin:10px 0;background:var(--surface)}
details.try summary{cursor:pointer;padding:12px 0;font-weight:500;list-style:none;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
details.try summary::-webkit-details-marker{display:none}
details.try summary::after{content:'Show answer';font-size:14px;color:var(--text-3);font-weight:500;border:1px solid var(--border);border-radius:6px;padding:2px 10px;white-space:nowrap}
details.try[open] summary::after{content:'Hide'}
details.try>div{padding:0 0 14px;color:var(--green);font-weight:500}

/* Plot steps */
.steps{display:grid;gap:0;margin:16px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}
.step{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:12px 16px;position:relative}
.step+.step{border-top:1px solid var(--border)}
.step b{font-size:15px;display:flex;align-items:center;gap:10px}
.step b::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex:none}
.step.top b::before{background:var(--primary)}
.step span{color:var(--text-2);font-size:16px}
.pyr{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px}
.pyr svg{display:block;width:100%;min-width:520px;height:auto}
.pyr text{fill:var(--text);font:600 13px var(--font)}.pyr .s{fill:var(--text-3);font-weight:500;font-size:11.5px}
.pyr path{stroke:var(--text);fill:none;stroke-width:2}.pyr circle{fill:var(--surface);stroke:var(--text);stroke-width:2}
blockquote{margin:0}

/* Home */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border);background:var(--surface);padding:72px 24px 64px}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;background-position:center top;-webkit-mask-image:radial-gradient(ellipse 70% 75% at 50% 45%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 70% 75% at 50% 45%,#000 25%,transparent 80%)}
.hero-glow{position:absolute;left:50%;top:48%;width:760px;max-width:100%;height:340px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,var(--surface) 62%,transparent)}
.hero-c{position:relative;display:grid;justify-items:center;text-align:center;gap:12px;max-width:660px;margin:0 auto}
.wordmark{font-size:clamp(52px,8.5vw,104px);font-weight:800;letter-spacing:-.06em;line-height:.95;margin:0 0 6px}
.hero h2{font-size:24px;font-weight:600;margin:0}
.hero p{color:var(--text-2);font-size:18px;margin:0;max-width:540px}
.hero .row{justify-content:center;margin-top:10px}
.hero .tile{z-index:0}
@media (max-width:1100px){.hero .tile{display:none}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden}
.stat{padding:18px 22px;display:grid;gap:2px}.stat+.stat{border-left:1px solid var(--border)}
.stat b{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:15px;color:var(--text-3)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.mode{display:grid;grid-template-rows:auto 1fr;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .22s ease,box-shadow .22s ease,border-color .22s}
.mode:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.mode .grid-top{height:120px}
.mode-b{padding:18px 20px 20px;display:grid;gap:4px}
.mode-b h3{margin:0;font-size:19px;font-weight:650}
.mode-b p{margin:0;color:var(--text-3);font-size:15px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.q-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);text-decoration:none;font-weight:500;box-shadow:var(--shadow-sm);transition:border-color .15s,transform .15s}
.q-item:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.q-item>.ic:last-child{width:16px;height:16px;color:var(--text-3)}
.q-ic{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center}
.q-ic .ic{width:19px;height:19px}

/* Flashcards */
.fc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden;cursor:pointer}
.fc .grid-top{height:96px}
.fc-b{padding:26px 30px 30px;text-align:center;min-height:180px;display:grid;align-content:center;gap:10px}
.fc-l{font-size:14px;color:var(--text-3);font-weight:500}
.fc-q{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.fc-a{font-size:17px;color:var(--text-2);border-top:1px dashed var(--border);padding-top:12px}
.fc.hide .fc-a{display:none}
.fc-n{font-size:15px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* Mobile */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;z-index:60;width:min(320px,88vw);transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .sb-open .sidebar{transform:none}
  .sb-inner{padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
  .sb-open .backdrop{opacity:1;pointer-events:auto}
  .menu-btn{display:grid!important}
  .topbar{top:env(safe-area-inset-top,0px);padding:0 16px;gap:10px;grid-template-columns:auto minmax(0,1fr) auto}
  .page{padding:28px 16px 90px}
  .ph h1{font-size:28px}
  .hero{padding:52px 16px 46px}
  .hero .tile{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--border)}
  .step{grid-template-columns:minmax(0,1fr);gap:2px}
  .fc-b{padding:22px 18px 24px}
  .fc-q{font-size:21px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" aria-label="Navigation"><div class="sb-inner">
    <a class="logo" href="#home"><span class="logo-mark">S</span><span class="logo-txt"><span class="logo-t">Short Stories</span><span class="logo-s">Geng F3A · Literature</span></span></a>
    <nav class="nav" id="nav"></nav>
  </div></aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main-col">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu"></button>
      <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark"></button>
    </header>
    <main id="main"></main>
  </div>
</div>

 sparkle:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="m6 6 2 2M16 16l2 2M6 18l2-2M16 8l2-2"/>',

 timer:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.5"/><path d="M9.5 2.5h5"/><path d="m18.5 6 1.5-1.5"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M17 6l3 3M14.5 8.5l2 2"/>',

const theory=()=>`
<div class="ph"><h1>Literary Theory</h1><p>The essentials from your theory pages.</p></div>
${box('','info','','<p>Always back up a claim with a short quote and the line number.</p>')}

${sec('Short story features')}
<div class="card card-b"><ul>
 <li>Short prose, simple language; one setting, few characters.</li>
 <li>Everyday people, no heroes.</li>
 <li>One decisive moment, a snapshot of life.</li>
 <li>Often an abrupt start and an open or twist ending.</li>
 <li>Imagery and symbols; born in 19th century US newspapers.</li>
</ul></div>

${sec("Freytag's Pyramid")}
<div class="pyr"><svg viewBox="0 0 720 230" role="img" aria-label="Freytag's pyramid">
 <path d="M20 190 L150 190 L190 175 L360 40 L530 175 L570 190 L700 190"/>
 <circle cx="150" cy="190" r="5"/><circle cx="190" cy="175" r="5"/><circle cx="360" cy="40" r="6"/><circle cx="530" cy="175" r="5"/><circle cx="570" cy="190" r="5"/>
 <text x="40" y="212">Exposition</text><text x="140" y="160" text-anchor="end">Inciting incident</text>
 <text x="235" y="100" text-anchor="end">Rising action</text><text x="360" y="26" text-anchor="middle">Climax</text>
 <text x="485" y="100">Falling action</text><text x="545" y="160">Resolution</text><text x="600" y="212">Denouement</text>
 <text x="360" y="60" text-anchor="middle" class="s">turning point, most intense moment</text></svg></div>
<div class="steps">${[['Exposition','Setting, characters, background.'],['Inciting incident','Starts the main conflict.'],['Rising action','Obstacles build tension.'],['Climax','Turning point, most intense moment.'],['Falling action','Consequences.'],['Resolution','Conflict wrapped up.'],['Denouement','The new reality afterwards.'],['Foreshadowing','Hints about what comes later.']].map(s=>`<div class="step${s[0]==='Climax'?' top':''}"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>

${sec('Narrator')}
<div class="fields">
 ${field('First person','"I" inside the story; limited view.')}
 ${field('Third person limited','Inside one character\'s head.')}
 ${field('Third person omniscient','Knows everything about everyone.')}
 ${field('Third person objective','Only what is seen and heard.')}
 ${field('Unreliable','Biased or distorted; we doubt the story.')}
</div>

${sec('Characterisation')}
<div class="fields">
 ${field('Direct','Qualities are stated outright.')}
 ${field('Indirect','Shown through thoughts, actions, speech, looks and how others react.')}

</div>

${sec('Irony, theme, symbol')}
<div class="fields">
 ${field('Situational irony','The opposite of what we expect happens.')}

 ${field('Atmosphere','The feeling a setting creates: calm, tense, gloomy, mysterious.')}

</div>`;
const theoryOld=()=>`
<div class="ph"><h1>Literary Theory</h1><p>Everything from your Literary Theory and Setting and Atmosphere pages.</p></div>
${box('','info','Exam rule from class','<p>Always support a claim with evidence from the text: a short quote and the line number.</p>')}

${sec('What makes a short story')}
<div class="card card-b"><ul>
 <li>Prose in simple language; shorter and less complex than a novel.</li>
 <li>One setting, few characters, few events.</li>
 <li>Everyday people, no heroes.</li>
 <li>Often an open plot: abrupt opening and abrupt or open ending.</li>
 <li>Focus on one decisive moment that shows a character's strengths and weaknesses: a snapshot of life.</li>
 <li>Imagery and symbols create one effect in the reader's mind.</li>
 <li>Emerged in the USA in the 19th century because newspapers needed shorter texts.</li>
</ul></div>

${sec("Freytag's Pyramid",'The stages of plot development.')}
<div class="pyr"><svg viewBox="0 0 720 230" role="img" aria-label="Freytag's pyramid">
 <path d="M20 190 L150 190 L190 175 L360 40 L530 175 L570 190 L700 190"/>
 <circle cx="150" cy="190" r="5"/><circle cx="190" cy="175" r="5"/><circle cx="360" cy="40" r="6"/><circle cx="530" cy="175" r="5"/><circle cx="570" cy="190" r="5"/>
 <text x="40" y="212">Exposition</text><text x="140" y="160" text-anchor="end">Inciting incident</text>
 <text x="235" y="100" text-anchor="end">Rising action</text><text x="360" y="26" text-anchor="middle">Climax</text>
 <text x="485" y="100">Falling action</text><text x="545" y="160">Resolution</text><text x="600" y="212">Denouement</text>
 <text x="360" y="60" text-anchor="middle" class="s">turning point, most intense moment</text></svg></div>
<div class="fields">
 ${field('Exposition','Setting, characters and background are introduced.')}
 ${field('Inciting incident','The moment that sets the main conflict in motion.')}
 ${field('Rising action','Conflicts and obstacles that build tension.')}
 ${field('Climax','The turning point and most intense moment.')}
 ${field('Falling action','Events that show the consequences and lead to the resolution.')}
 ${field('Resolution','The main conflict is wrapped up.')}
 ${field('Denouement','The aftermath: the characters\' new reality or a hint at the future.')}
 ${field('Foreshadowing','Hints about later events in dialogue, descriptions or symbols. Builds suspense.')}
</div>

${sec('The narrator')}
<div class="fields">
 ${field('First person','A character tells the story with "I" or "we". Personal, limited view.','A Day\'s Wait, The Tell-Tale Heart, Six Feet of the Country')}
 ${field('Third person limited','Shows the thoughts and feelings of only one character.','The Necklace, The Landlady')}
 ${field('Third person omniscient','Knows everything about all characters. Not part of the story.')}
 ${field('Third person objective','Only what can be seen and heard, no thoughts. Also called neutral.','Thank You, Ma\'am comes close')}
 ${field('Unreliable narrator','Biased, deceptive or distorted, so we question the story. Any type except the objective one can be biased.','The Tell-Tale Heart, Six Feet of the Country')}
</div>

${sec('Characterisation')}
<div class="fields">
 ${field('Direct (explicit)','The author, narrator, another character or the character directly states the qualities.','"Sam\'s the worst." directly calls Sam selfish and cruel.')}
 ${field('Indirect (implicit)','We infer qualities from thoughts, actions, words, way of talking, appearance, mannerisms and how others react.')}
 ${field('Internal traits','Personality: intelligent, wise, determined, selfish, caring.')}
 ${field('External traits','Physical: tall, athletic, brown eyes, dirty face.')}
</div>
${box('','bulb','Useful extra words','<p><b>Protagonist</b> and <b>antagonist</b>; <b>flat</b> (one trait) vs <b>round</b> (complex); <b>static</b> (no change) vs <b>dynamic</b> (changes). Mathilde and Roger are dynamic, Madame Forestier is flat.</p>')}

${sec('Irony')}
<div class="fields">
 ${field('Situational irony','What happens is the opposite of what we expected. Surprising but logical in hindsight; funny or tragic.','The Necklace: ten years of work for a fake necklace.')}
 ${field('Dramatic irony','The reader knows something the characters do not. Creates tension or humour.','The Landlady; the police search in The Tell-Tale Heart.')}
 ${field('Verbal irony','Saying the opposite of what you mean.','Six Feet: a pauper\'s grave made to "sound like a privilege".')}
</div>

${sec('Theme, symbol, setting')}
<div class="fields">
 ${field('Theme','The central message beyond the events (love, justice, identity). Rarely stated; shown through characters, conflicts and outcomes.')}
 ${field('Symbol','Something that stands for more than its literal meaning: journey = growth, storm = conflict, window = moving into another sphere. Often cultural (white = purity, or mourning in parts of Asia).')}
 ${field('Setting','Place, time, season and historical background. Ask why it matters and how it changes.')}
 ${field('Atmosphere','The feeling the setting creates. Positive: calm, warm. Negative: gloomy, tense. Mysterious: strange, unsettling. Neutral: quiet, ordinary.')}
 ${field('Imagery','Language that appeals to the senses to create a vivid picture.')}
 ${field('Iceberg Theory','Hemingway\'s "theory of omission": 1/8 visible (facts, dialogue), 7/8 hidden (emotion, subtext, theme).')}
</div>
${box('green','pen','Sentence starters','<ul><li>The story is set in … / takes place in …, during …</li><li>At first, the setting seems …, but later it becomes …</li><li>Words such as "…" and "…" make the place seem …</li><li>As the story continues, the mood changes from … to …</li><li>This creates tension / a sense of danger / a feeling of calm.</li></ul>')}`;

const devices=[
 ["Alliteration","Same consonant sound at the start of nearby words.","\"From forth the fatal loins of these two foes\""],
 ["Anaphora","Same words at the start of successive clauses.","\"I have a dream … I have a dream …\""],
 ["Antithesis","Opposite ideas side by side.","\"the best of times, … the worst of times\"; A Day's Wait: ice outside, fever inside"],
 ["Epistrophe","Same words at the end of successive clauses.","\"of the people, by the people, for the people\""],
 ["Hyperbole","Extreme exaggeration.","\"I heard many things in hell\" (Tell-Tale Heart, l. 5)"],
 ["Metaphor","Comparison without like or as.","\"He had the eye of a vulture\" (Tell-Tale Heart, l. 9)"],
 ["Onomatopoeia","Words that copy sounds.","meow, sizzle"],
 ["Parallelism","Same sentence structure repeated.","\"with what caution, with what foresight\" (Tell-Tale Heart, l. 13)"],
 ["Personification","Human qualities for non-human things.","\"Death … had stalked with his black shadow\" (Tell-Tale Heart, l. 55)"],
 ["Rule of three","Three elements for emphasis.","\"Friends, Romans, countrymen\""],
 ["Simile","Comparison with like or as.","\"the wind was like a flat blade of ice\" (Landlady, l. 4)"],
 ["Repetition","Repeating words for tension or feeling.","\"louder, louder\" (Tell-Tale Heart); \"bed and breakfast\" (Landlady, l. 49)"]
];

{id:'telltale',ic:'eye',title:'The Tell-Tale Heart',author:'Edgar Allan Poe',year:'1843',

 chars:[['The narrator','Obsessive, paranoid, proud of his cleverness, cruel; yet guilt breaks out.'],['The old man','Unnamed and harmless ("He had never wronged me"); we only see his eye.'],['The police','Calm and friendly; their calm makes him more paranoid.']],
 themes:['Madness','Guilt and conscience','Obsession','Being watched and judged'],

 irony:'Dramatic irony: we know the body is under the floor while the police search (ll. 101ff.). Situational irony: his "perfect" crime is destroyed by himself.',

];

const cards=[
 ['Theory','Climax','The turning point and most intense moment.'],
 ['Theory','Inciting incident','The moment that sets the main conflict in motion.'],
 ['Theory','Exposition','Introduction of setting, characters and background.'],
 ['Theory','Falling action','Events after the climax that show the consequences.'],
 ['Theory','Denouement','The aftermath: the characters\' new reality.'],
 ['Theory','Foreshadowing','Hints about later events; builds suspense.'],
 ['Theory','Direct characterisation','Qualities are stated directly.'],
 ['Theory','Indirect characterisation','Qualities shown through thoughts, actions, words, tone, appearance and reactions.'],
 ['Theory','Situational irony','The opposite of what we expected happens.'],
 ['Theory','Dramatic irony','The reader knows something the characters do not.'],
 ['Theory','Unreliable narrator','A biased, deceptive or distorted narrator.'],
 ['Theory','Objective narrator','Only what can be seen and heard; no thoughts.'],
 ['Theory','Theme','The central message, usually not stated directly.'],
 ['Theory','Symbol','Something that stands for more than its literal meaning.'],
 ['Theory','Iceberg Theory','Show 1/8 on the surface; the reader infers the hidden 7/8.'],
 ['Devices','Anaphora','Same words at the start of successive clauses.'],
 ['Devices','Epistrophe','Same words at the end of successive clauses.'],

let fc={deck:'All',list:[],i:0};
const flashPage=()=>`<div class="ph"><h1>Flashcards</h1><p>Tap the card to show the answer.</p></div>
<div class="row" style="margin-bottom:18px"><div class="chips" id="decks">${['All','Theory','Devices','Stories'].map(d=>`<button class="chip${d===fc.deck?' on':''}" data-d="${d}" type="button">${d}</button>`).join('')}</div><span style="flex:1"></span><button class="btn btn-s" id="shuf" type="button">${icon('shuffle')}Shuffle</button></div>

<div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn btn-s" id="prev" type="button">${icon('arrowL')}Back</button><span class="fc-n" id="cnt"></span><button class="btn btn-p" id="next" type="button">Next${icon('arrowR')}</button></div>`;
function initFlash(){
 const $=id=>document.getElementById(id);
 const build=()=>{fc.list=cards.filter(c=>fc.deck==='All'||c[0]===fc.deck);fc.i=0;show()};
 const show=()=>{const c=fc.list[fc.i];$('fl').textContent=c[0];$('fq').textContent=c[1];$('fa').textContent=c[2];$('fc').classList.add('hide');$('cnt').textContent=(fc.i+1)+' / '+fc.list.length};
 const flip=()=>$('fc').classList.toggle('hide');
 $('fc').onclick=flip;$('fc').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};
 $('next').onclick=()=>{fc.i=(fc.i+1)%fc.list.length;show()};
 $('prev').onclick=()=>{fc.i=(fc.i-1+fc.list.length)%fc.list.length;show()};
 $('shuf').onclick=()=>{const a=fc.list;for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}fc.i=0;show()};
 document.querySelectorAll('#decks .chip').forEach(b=>b.onclick=()=>{fc.deck=b.dataset.d;document.querySelectorAll('#decks .chip').forEach(x=>x.classList.toggle('on',x===b));build()});
 build();
}
